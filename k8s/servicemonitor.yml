apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thinkai-backend
  namespace: monitoring
  labels:
    release: monitoring-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: thinkai-backend
  endpoints:
  - port: backend
    path: /actuator/prometheus
    interval: 30s