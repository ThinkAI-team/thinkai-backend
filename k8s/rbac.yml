apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: thinkai
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: thinkai
subjects:
- kind: ServiceAccount
  name: default
  namespace: thinkai
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
