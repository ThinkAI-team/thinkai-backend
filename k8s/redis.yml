apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thinkai-redis
  namespace: thinkai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: thinkai-redis
  namespace: thinkai
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: thinkai-redis
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkai-redis
  namespace: thinkai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thinkai-redis
  template:
    metadata:
      labels:
        app: thinkai-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - allkeys-lru
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: thinkai-redis