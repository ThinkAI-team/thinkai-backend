# ==============================================================================
# ThinkAI Backend - Profile LOCAL (YAML Format)
# ==============================================================================
openrouter:
  api:
    key: ${OPENROUTER_API_KEY:}
    keys: ${OPENROUTER_API_KEYS:}
    models: ${OPENROUTER_API_MODELS:}
    url: "https://openrouter.ai/api/v1/chat/completions"
    model: ${OPENROUTER_API_MODEL:}
    fallback-model: ${OPENROUTER_API_FALLBACK_MODEL:}
    temperature: ${OPENROUTER_API_TEMPERATURE:0.3}
    top-p: ${OPENROUTER_API_TOP_P:0.9}
    max-tokens: ${OPENROUTER_API_MAX_TOKENS:700}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/thinkai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  errors:
    expose-internal-message: true

# ==============================================================================
# payOS Configuration
# ==============================================================================
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  webhook-url: ${PAYOS_WEBHOOK_URL:http://localhost:8081/api/v1/payments/webhook}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}
  base-url: https://api-merchant.payos.vn
