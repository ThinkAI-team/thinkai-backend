apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thinkai-backend
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/ThinkAI-team/thinkai-backend.git
    targetRevision: develop
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: thinkai
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true